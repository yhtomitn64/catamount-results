var TABS = [
  { id: "racer", label: "Racers" },
  { id: "h2h", label: "Head to head" },
  { id: "course", label: "Courses" },
  { id: "series", label: "Seasons" },
  { id: "races", label: "All races" }
];

function render(keepScroll) {
  var parts = (location.hash || "#/racer").replace(/^#\/?/, "").split("/").filter(Boolean);
  var tab = parts[0] || "racer";
  if (!views[tab]) tab = "racer";

  document.getElementById("nav").innerHTML = TABS.map(function (t) {
    return '<a href="#/' + t.id + '" class="' + (t.id === tab ? "on" : "") + '">' + esc(t.label) + "</a>";
  }).join("");

  TABLES = {};
  document.getElementById("view").innerHTML = views[tab].apply(null, parts.slice(1));
  if (keepScroll !== true) window.scrollTo(0, 0);

  var search = document.getElementById("racer-search");
  if (search) {
    if (keepScroll !== true && !isTouch()) search.focus();
    search.oninput = debounce(function () { showHits(search.value); }, 120);
  }

  wirePickers();
  var pa = document.getElementById("h2h-a"), pb = document.getElementById("h2h-b");
  if (pa && pb && keepScroll !== true && !isTouch()) {
    // Land in the first empty box, so picking two people is two typed names.
    if (!pa.dataset.key) pa.focus(); else if (!pb.dataset.key) pb.focus();
  }
}

function showHits(q) {
  var box = document.getElementById("racer-hits");
  if (!box) return;
  if (!q.trim()) { box.innerHTML = ""; return; }
  var hits = searchRacers(q, 12);
  box.innerHTML = hits.length
    ? '<div class="legend" style="margin-top:12px">' + hits.map(function (e) {
        return '<a class="pill" href="#/racer/' + esc(e.key) + '">' + esc(e.name) +
               ' <span class="muted">' + e.starts + "</span></a>";
      }).join("") + "</div>"
    : '<p class="hint" style="margin-top:12px">No one by that name.</p>';
}

document.addEventListener("click", function (e) {
  var b = e.target && e.target.closest ? e.target.closest("button[data-filter]") : null;
  if (!b) return;
  discFilter = b.dataset.filter;
  try { window.localStorage.setItem("catamount-filter", discFilter); } catch (err) { /* fine without storage */ }
  render(true);
});

document.addEventListener("click", function (e) {
  var yb = e.target && e.target.closest ? e.target.closest("button[data-year]") : null;
  if (!yb) return;
  chartYear = yb.dataset.year === "all" ? null : +yb.dataset.year;
  render(true);
});

document.addEventListener("click", function (e) {
  var more = e.target && e.target.closest ? e.target.closest("button[data-more]") : null;
  if (more) {
    var box = more.closest(".scroll");
    TABLES[box.id].showAll = true;
    box.innerHTML = tableHTML(box.id);
    return;
  }
  var svgEl = e.target && e.target.closest ? e.target.closest("svg.chart") : null;
  if (svgEl) {
    // The chart is scaled to the screen, so a dot can be only a few pixels wide
    // on a phone. Take the dot nearest the tap, if one is within a fingertip.
    var best = null, bestD = 24;
    Array.prototype.forEach.call(svgEl.querySelectorAll("circle.pt"), function (c) {
      var r = c.getBoundingClientRect();
      var d = Math.sqrt(Math.pow(e.clientX - (r.left + r.width / 2), 2) + Math.pow(e.clientY - (r.top + r.height / 2), 2));
      if (d < bestD) { bestD = d; best = c; }
    });
    var out = svgEl.nextElementSibling;
    if (best && out && out.classList.contains("chart-readout")) out.textContent = best.getAttribute("data-t");
  }
});

window.addEventListener("hashchange", function () { chartYear = null; render(); });

var lastChartWidth = chartWidth();
window.addEventListener("resize", debounce(function () {
  if (chartWidth() !== lastChartWidth) { lastChartWidth = chartWidth(); render(true); }
}, 250));

    ? " and its old website, as the Wayback Machine kept it" : "") +
  (D.generated ? " · built " + esc(D.generated.replace("T", " ").replace("Z", " UTC")) : "") +
  (RACES.some(function (r) { return r.courseSource; })
    ? '<p class="fine">* The race title does not name a course, so it comes from Catamount\'s own weekly results sheets or ' +
      "announcements, a rider's GPS track, or the same week's other race.</p>" : "");

render();
})();
</script>
</body>
</html>
