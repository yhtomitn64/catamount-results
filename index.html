<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catamount Race Series</title>
<style>
:root{
  --bg:#f6f7f5; --panel:#ffffff; --panel-2:#f0f2ee; --line:#dfe3da;
  --ink:#1d2320; --ink-2:#5a635c; --ink-3:#8b948c;
  --accent:#2f6f4e; --accent-ink:#ffffff; --good:#2f6f4e; --bad:#a63d2f;
  --shadow:0 1px 2px rgba(20,30,20,.06),0 4px 16px rgba(20,30,20,.05);
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12150f; --panel:#1a1e17; --panel-2:#222720; --line:#313828;
    --ink:#e8ece4; --ink-2:#a4ae9f; --ink-3:#727c6e;
    --accent:#6bbd8c; --accent-ink:#0f1410; --good:#6bbd8c; --bad:#e08a72;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#12150f; --panel:#1a1e17; --panel-2:#222720; --line:#313828;
  --ink:#e8ece4; --ink-2:#a4ae9f; --ink-3:#727c6e;
  --accent:#6bbd8c; --accent-ink:#0f1410; --good:#6bbd8c; --bad:#e08a72;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 64px}

header.top{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
.top .wrap{padding-top:14px;padding-bottom:0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:19px;margin:0;letter-spacing:-.01em}
.brand .sub{color:var(--ink-3);font-size:13px}
nav{display:flex;gap:2px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{
  padding:9px 13px;border-radius:8px 8px 0 0;color:var(--ink-2);font-size:14px;
  white-space:nowrap;border-bottom:2px solid transparent;
}
nav a.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav a:hover{background:var(--panel-2);text-decoration:none}

.banner{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 14px;margin:16px 0 0;font-size:13px;color:var(--ink-2);
}
.banner strong{color:var(--ink)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px;margin-top:16px}
.card h2{margin:0 0 4px;font-size:16px;letter-spacing:-.01em}
.card h2 + .hint{margin:0 0 14px}
.hint{color:var(--ink-3);font-size:13px;margin:0 0 12px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:14px 0 0}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.stat .n{font-size:21px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .n.word{font-size:15px;font-weight:600;letter-spacing:0;line-height:1.35;padding:3px 0 2px}
.stat .l{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;
   position:sticky;top:0;background:var(--panel);cursor:pointer;white-space:nowrap}
th.nosort{cursor:default}
tbody tr:hover{background:var(--panel-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-height:70vh;margin:0 -18px;padding:0 18px}

input,select,button{font:inherit;color:var(--ink)}
input[type=search],input[type=text],select{
  background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;width:100%;
}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{flex:1 1 180px;min-width:0}
.row > .shrink{flex:0 0 auto}
button.ghost{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}
button.ghost:hover{border-color:var(--accent)}

/* Touch: no double-tap-zoom delay, 16px inputs (iOS zooms into anything smaller), 44px
   targets, and tables that scroll with the page instead of trapping the finger. */
a,button,input,th,.picker-list li{touch-action:manipulation}
.chart-readout{min-height:20px;margin-top:8px;font-size:13px;color:var(--ink-2)}
svg.chart circle.pt{cursor:pointer}
.more-row{padding:12px 0 4px;text-align:center}
@media (pointer:coarse){
  input[type=search],input[type=text],select{font-size:16px;padding:12px 13px}
  nav a{padding:14px 12px}
  .filter button{min-height:44px;padding:0 17px;font-size:14px}
  th,td{padding:12px 8px}
  th{padding-top:14px;padding-bottom:14px}
  a.pill{padding:11px 14px;font-size:13px}
  button.ghost{min-height:44px;padding:0 16px}
  .picker-list{max-height:min(340px,42vh)}
  .picker-list li{min-height:46px;align-items:center}
  .scroll{max-height:none;-webkit-overflow-scrolling:touch}
  footer a{display:inline-block;padding:14px 6px}
}
@media (max-height:520px){header.top{position:static}}   /* landscape phone: don't spend a quarter of the screen on a pinned header */
@media (pointer:coarse) and (max-width:520px){
  nav a{padding:14px 8px;font-size:13px}
  th{letter-spacing:.02em}
}

.picker{position:relative}
.picker-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;margin:0;padding:4px;
  list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 8px 28px rgba(0,0,0,.28);max-height:340px;overflow:auto}
.picker-list[hidden]{display:none}
.picker-list li{padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:14px}
.picker-list li[aria-selected="true"],.picker-list li:hover{background:var(--panel-2)}
.picker-list li .muted{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.picker-list li.none{cursor:default;color:var(--ink-3)}
.filter{display:inline-flex;margin-top:16px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel);overflow:hidden;max-width:100%}
.filter button{border:0;background:transparent;color:var(--ink-2);font-size:13px;padding:6px 15px;
  cursor:pointer;white-space:nowrap}
.filter button + button{border-left:1px solid var(--line)}
.filter button:hover{background:var(--panel-2)}
.filter button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seasons{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.seasons button{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font-size:13px;
  padding:4px 12px;border-radius:999px;cursor:pointer;min-height:32px}
.seasons button:hover{background:var(--panel-2)}
.seasons button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
@media (pointer:coarse){.seasons button{min-height:40px;padding:0 15px}}
@media (max-width:700px){   /* twenty seasons would stack five rows deep: one scrolling row instead */
  .seasons{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .seasons::-webkit-scrollbar{display:none}
  .seasons button{flex:0 0 auto}
}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 9px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px rgba(128,128,128,.45) inset}
.medal{font-variant-numeric:tabular-nums;font-weight:650}
.medal.p1{color:#a6770a}.medal.p2{color:#767b7e}.medal.p3{color:#8f5f3c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .medal.p1{color:#e0b64a}
  :root:not([data-theme="light"]) .medal.p2{color:#b6bcbf}
  :root:not([data-theme="light"]) .medal.p3{color:#cf9268}}
:root[data-theme="dark"] .medal.p1{color:#e0b64a}
:root[data-theme="dark"] .medal.p2{color:#b6bcbf}
:root[data-theme="dark"] .medal.p3{color:#cf9268}
.win{color:var(--good);font-weight:600}
.loss{color:var(--bad)}
.muted{color:var(--ink-3)}
.big-name{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}}

svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{fill:var(--ink-3);font-size:10px}
svg.chart .axis{stroke:var(--line);stroke-width:1}
svg.chart .gridline{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
svg.chart .pt{stroke:var(--panel);stroke-width:1.25}

.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.empty{color:var(--ink-3);padding:26px 0;text-align:center;font-size:14px}
footer{color:var(--ink-3);font-size:12.5px;margin-top:30px;text-align:center}
footer .fine{max-width:640px;margin:10px auto 0;line-height:1.45}
sup.inferred{font-size:.8em;margin-left:1px;color:var(--ink-3);cursor:help}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Catamount Race Series</h1>
      <span class="sub" id="subtitle"></span>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<div class="wrap">
  <div id="banner"></div>
  <main id="view"></main>
  <footer id="footer"></footer>
</div>

<script src="data/catamount.js"></script>
<script>
(function () {
"use strict";

// ---------------------------------------------------------------------------
// data loading
// ---------------------------------------------------------------------------

var D = window.CATAMOUNT_DATA;
if (!D) {
  document.getElementById("view").innerHTML =
    '<div class="card"><h2>No data loaded</h2><p class="hint">' +
    'Expected <code>data/catamount.js</code> next to this page. Run ' +
    '<code>python scrape.py all</code> (or <code>python tools/make_sample_data.py</code> ' +
    'for the sample set) and reload.</p></div>';
  return;
}

var RACES = D.races, RESULTS = D.results;
var raceById = {}, resultsByRace = {}, resultsByRacer = {}, resultsByDiv = {},
    courses = {}, years = {};

RACES.forEach(function (r) { raceById[r.raceid] = r; resultsByRace[r.raceid] = []; });

// A race night is not one race. Wednesday MTB runs Half, 1, 2, 3 and 4 lap groups
// off the same start, Tuesday trail run runs Half / 5K / 10K, and cyclocross is a
// single mass start. The unit of competition is (race night, distance group):
// placings, percentiles, rivals and head to head are all computed inside it and
// never across it. The group is the source's own `distance` label, NOT the lap
// count - in cross the laps completed are a result, and Half and Cadet have no
// laps at all. An empty distance means one undivided field, and keys as such.
var DISC_NAMES = { MTB: "MTB", TR: "Trail run", CX: "Cyclocross", vMTB: "Virtual MTB", vTR: "Virtual run" };
// 2021 began with self-timed "virtual" weeks (race.virtual). They are their own event type:
// their own groups (evOf), no wins or podiums, and no rivals or head to head, because
// nobody shared a start line.
function evOf(race) { return (race.virtual ? "v" : "") + ((race || {}).discipline || "?"); }
function isVirt(r) { return !!(raceById[r.raceid] || {}).virtual; }
function isWin(r) { return r.dplace === 1 && !isVirt(r); }
// Where a race's results came from, by the link: Webscorer for most, Catamount's own sheets and
// its old website (as the Wayback Machine kept it) for the earlier ones.
function sourceName(url) {
  if (/webscorer\.com/.test(url)) return "Webscorer";
  if (/archive\.org/.test(url)) return "Old results page";
  return "Results sheet";
}
function isPodium(r) { return !!r.dplace && r.dplace <= 3 && !isVirt(r); }
function inPerson(r) { return !isVirt(r); }
function distOf(r) { return r.distance || ""; }
function grpOf(r) { return evOf(raceById[r.raceid] || {}) + "|" + distOf(r); }
function divOf(r) { return r.raceid + "|" + distOf(r); }
function discPart(g) { return g.split("|")[0]; }
function distPart(g) { return g.slice(g.indexOf("|") + 1); }
// "MTB|4 Lap" -> "MTB · 4 Lap"; an undivided field ("CX|") is just "Cyclocross".
function grpLabel(g) {
  var d = DISC_NAMES[discPart(g)] || discPart(g), x = distPart(g);
  return x ? d + " · " + x : d;
}
function distLabel(d) { return d || "All finishers"; }

// Event-type filter, shared by every page that mixes sports. It is remembered
// per browser, but nothing depends on it: the page renders fine without storage.
var FILTERS = [
  { id: "all", label: "All" }, { id: "MTB", label: "MTB" },
  { id: "CX", label: "Cyclocross" }, { id: "TR", label: "Run" }, { id: "V", label: "Virtual 2021" }
];
var discFilter = "all";
try {
  var savedFilter = window.localStorage && window.localStorage.getItem("catamount-filter");
  if (FILTERS.some(function (f) { return f.id === savedFilter; })) discFilter = savedFilter;
} catch (e) { /* private window or blocked storage: start on All */ }
// "All" shows everything; a sport shows its in-person races; "Virtual 2021" shows the self-timed weeks.
function passRace(race) {
  if (discFilter === "all") return true;
  return discFilter === "V" ? !!race.virtual : !race.virtual && race.discipline === discFilter;
}
function passRow(r) { return passRace(raceById[r.raceid] || {}); }
function rowsOf(k) { return (resultsByRacer[k] || []).filter(passRow); }
function filterName() {
  var f = FILTERS.filter(function (x) { return x.id === discFilter; })[0];
  return f && f.id !== "all" ? f.label : "";
}
function filterBar() {
  return '<div class="filter" role="group" aria-label="Event type">' + FILTERS.map(function (f) {
    var on = f.id === discFilter;
    return '<button type="button" data-filter="' + f.id + '" class="' + (on ? "on" : "") +
           '" aria-pressed="' + on + '">' + esc(f.label) + "</button>";
  }).join("") + "</div>";
}

RESULTS.forEach(function (r) {
  if (!raceById[r.raceid]) return;
  r.grp = grpOf(r);
  r.div = divOf(r);
  (resultsByRace[r.raceid] = resultsByRace[r.raceid] || []).push(r);
  (resultsByRacer[r.racer] = resultsByRacer[r.racer] || []).push(r);
  (resultsByDiv[r.div] = resultsByDiv[r.div] || []).push(r);
});

// Derived fields, all within the lap group: divisional placing, field size,
// percentile, gap to that group's winner, and time as a ratio of it.
Object.keys(resultsByDiv).forEach(function (key) {
  var rows = resultsByDiv[key];
  rows.sort(function (a, b) {
    var x = a.seconds == null ? Infinity : a.seconds,
        y = b.seconds == null ? Infinity : b.seconds;
    if (x !== y) return x - y;
    return (a.place || 1e9) - (b.place || 1e9);
  });
  var n = rows.length, win = null;
  for (var i = 0; i < rows.length; i++) { if (rows[i].seconds) { win = rows[i].seconds; break; } }
  rows.forEach(function (r, i) {
    // Recomputed rather than trusted: whether the source's printed place is
    // overall or per-distance varies, and this has to be per-distance.
    r.dplace = (r.seconds == null && r.place == null) ? null : i + 1;
    r.field = n;
    r.pct = n > 1 && r.dplace ? (n - r.dplace) / (n - 1) : null;   // 1 = won, 0 = last
    r.gap = (r.seconds && win) ? r.seconds - win : null;
    r.ratio = (r.seconds && win) ? r.seconds / win : null;
  });
});

// "Longest first" is data driven: by median finish time, so 4 Lap sorts before
// 1 Lap and 10K before 5K without a hand-kept list of distances.
function medSecs(rows) {
  var m = median(rows.map(function (r) { return r.seconds; }).filter(function (v) { return v != null; }));
  return m == null ? -1 : m;
}
var grpRows = {}, GRP_MED = {};
RESULTS.forEach(function (r) { if (r.grp) (grpRows[r.grp] = grpRows[r.grp] || []).push(r); });
Object.keys(grpRows).forEach(function (g) { GRP_MED[g] = medSecs(grpRows[g]); });
function grpRank(g) { return GRP_MED[g] == null ? -1 : GRP_MED[g]; }
function byLongest(a, b) { return grpRank(b) - grpRank(a); }

RACES.forEach(function (race) {
  var by = {};
  (resultsByRace[race.raceid] || []).forEach(function (r) { (by[distOf(r)] = by[distOf(r)] || []).push(r); });
  race.groups = Object.keys(by).sort(function (a, b) { return medSecs(by[b]) - medSecs(by[a]); });
  race.groupCounts = {};
  race.groups.forEach(function (d) { race.groupCounts[d] = by[d].length; });
});

RACES.forEach(function (r) {
  if (r.course) (courses[r.course] = courses[r.course] || []).push(r);
  if (r.year) (years[r.year] = years[r.year] || []).push(r);
});

var COURSE_NAMES = Object.keys(courses).sort();
var YEAR_LIST = Object.keys(years).map(Number).sort(function (a, b) { return b - a; });
var RACER_KEYS = Object.keys(resultsByRacer).sort(function (a, b) {
  return resultsByRacer[b].length - resultsByRacer[a].length;
});

function nameOf(key) { return (D.racers && D.racers[key]) || key; }

// ---- racer search (begin) ----
function fold(s) { return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
var SEARCH_INDEX = null;
// Every typed word must match. A name where a word STARTS with what was typed
// outranks one where it only appears inside a word; then people with more
// starts come first, then alphabetical.
function searchRacers(q, limit) {
  var terms = fold(q).split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  if (!SEARCH_INDEX) {
    SEARCH_INDEX = RACER_KEYS.map(function (k) {
      var n = nameOf(k), f = fold(n);
      return { key: k, name: n, text: f, words: f.split(/[^a-z0-9']+/).filter(Boolean), starts: resultsByRacer[k].length };
    });
  }
  var out = [];
  SEARCH_INDEX.forEach(function (e) {
    var score = 0;
    for (var i = 0; i < terms.length; i++) {
      var t = terms[i];
      if (e.words.some(function (w) { return w.indexOf(t) === 0; })) score += 2;
      else if (e.text.indexOf(t) >= 0) score += 1;
      else return;
    }
    out.push({ e: e, score: score });
  });
  out.sort(function (a, b) { return b.score - a.score || b.e.starts - a.e.starts || a.e.name.localeCompare(b.e.name); });
  return out.slice(0, limit || 8).map(function (x) { return x.e; });
}
// ---- racer search (end) ----

// A phone raises the on-screen keyboard as soon as a field is focused, so never
// focus one on the page's own initiative there.
function isTouch() { return !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches); }

function debounce(fn, ms) {
  var t;
  return function () {
    var self = this, args = arguments;
    clearTimeout(t);
    t = setTimeout(function () { fn.apply(self, args); }, ms);
  };
}

// ---------------------------------------------------------------------------
// formatting helpers
// ---------------------------------------------------------------------------

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtTime(sec) {
  if (sec == null) return "—";
  var neg = sec < 0; sec = Math.abs(sec);
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  var out = (h ? h + ":" + String(m).padStart(2, "0") : String(m)) + ":" +
            (s < 10 ? "0" : "") + s.toFixed(1);
  return (neg ? "−" : "") + out;
}
function fmtGap(sec) { return sec == null ? "—" : sec === 0 ? "—" : "+" + fmtTime(sec); }
function fmtPct(p) { return p == null ? "—" : Math.round(p * 100) + "%"; }
function fmtDate(iso) {
  if (!iso) return "—";
  var p = iso.split("-");
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1] - 1] +
         " " + (+p[2]) + ", " + p[0];
}
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function median(a) {
  if (!a.length) return null;
  var s = a.slice().sort(function (x, y) { return x - y; }), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

// --- weather -------------------------------------------------------------

// Rain in the hours before the gun is what actually changes the racing, so
// "wet" means recent precipitation, not just precipitation at 6pm sharp.
function isWet(w) { return !!w && (w.precip_3h > 0.01 || w.precip > 0.005); }

var SKY_COLORS = { "Sunny": "#d99a1f", "Mostly sunny": "#c49a4e", "Partly cloudy": "#8496a4",
                   "Mostly cloudy": "#78828b", "Overcast": "#69727d" };
function skyColor(w) {
  if (!w) return "#6f7a72";
  if (isWet(w)) return "#3a6ea8";
  return SKY_COLORS[w.sky] || "#6f7a72";
}
function fmtTemp(t) { return t == null ? "—" : Math.round(t) + "°F"; }
function wxLabel(w) {
  if (!w) return null;
  // When it is raining the coded summary is more specific than cloud cover.
  return isWet(w) && w.summary ? w.summary : (w.sky || w.summary || null);
}
function wxChip(w) {
  if (!w) return '<span class="muted">—</span>';
  var label = wxLabel(w);
  return '<span class="pill"><span class="dot" style="background:' + skyColor(w) + '"></span>' +
         fmtTemp(w.temp) + (label ? " · " + esc(label) : "") + "</span>";
}
function wxCell(race) {
  return race && race.weather ? "<td>" + wxChip(race.weather) + "</td>" : '<td class="muted">—</td>';
}

// Course names carry their own colours ("Red on Black"), so use them.
var HUES = { red:"#c8483a", black:"#4a4f52", white:"#9aa0a6", yellow:"#c9a227", green:"#3f8f5c",
             blue:"#3a6ea8", orange:"#cf7a2e", purple:"#7a5aa6", pink:"#c46a93", brown:"#8a6a4f" };
function courseColor(name) {
  var first = String(name || "").toLowerCase().split(/\s+/)[0];
  return HUES[first] || "#6f7a72";
}
// Where a course was not named in the race title, it was worked out another way;
// the pill carries an asterisk and the footer explains it.
var COURSE_SOURCE = {
  gps: "Inferred from a rider's GPS track that night",
  center: "From Catamount's own weekly results sheet or course announcement",
  sibling: "Inferred: the Tuesday run uses the same week's Wednesday course"
};
function coursePill(name, race) {
  if (!name) return '<span class="muted">—</span>';
  var mark = race && race.courseSource
    ? '<sup class="inferred" title="' + esc(COURSE_SOURCE[race.courseSource] || "Inferred") + '">*</sup>' : "";
  return '<a class="pill" href="#/course/' + slug(name) + '">' +
         '<span class="dot" style="background:' + courseColor(name) + '"></span>' + esc(name) + mark + "</a>";
}
function racerLink(key) { return '<a href="#/racer/' + esc(key) + '">' + esc(nameOf(key)) + "</a>"; }
// Takes the row, not a bare number: the placing that counts is the one inside
// the lap group, which only the row knows.
function placeCell(r) {
  var p = r.dplace;
  if (!p) return '<td class="num muted">—</td>';
  var cls = p <= 3 ? " medal p" + p : "";
  return '<td class="num"><span class="' + cls.trim() + '">' + p + "</span>" +
         '<span class="muted">/' + r.field + "</span></td>";
}
function grpCell(g) { return "<td>" + esc(grpLabel(g)) + "</td>"; }

// ---------------------------------------------------------------------------
// sortable tables
// ---------------------------------------------------------------------------

// cols: [{label, cls, get(row) -> sort value, cell(row) -> <td> html, sort:'desc'|'asc'|false}]
var tableSeq = 0;
function table(cols, rows, opts) {
  opts = opts || {};
  var id = "t" + (++tableSeq);
  TABLES[id] = { cols: cols, rows: rows, sort: opts.sort == null ? null : opts.sort, dir: opts.dir || 1, opts: opts };
  return '<div class="scroll" id="' + id + '">' + tableHTML(id) + "</div>";
}
var TABLES = {};
function tableHTML(id) {
  var t = TABLES[id], cols = t.cols, rows = t.rows.slice();
  if (t.sort != null && cols[t.sort].get) {
    var g = cols[t.sort].get, dir = t.dir;
    rows.sort(function (a, b) {
      var x = g(a), y = g(b);
      if (x == null && y == null) return 0;
      if (x == null) return 1;
      if (y == null) return -1;
      if (typeof x === "string" || typeof y === "string") return dir * String(x).localeCompare(String(y));
      return dir * (x - y);
    });
  }
  // A few tables run to a thousand rows. Show the first 200 (60 on a phone) of the
  // current sort and let the reader ask for the rest, so a phone is not handed a
  // 28,000px page.
  var total = rows.length, cap = t.opts.limit || (t.showAll ? 0 : isTouch() ? 60 : 200), capped = false;
  if (cap && rows.length > cap) { rows = rows.slice(0, cap); capped = !t.opts.limit; }
  var h = "<table><thead><tr>";
  cols.forEach(function (c, i) {
    var sortable = !!c.get;
    var arrow = t.sort === i ? (t.dir === 1 ? " ↑" : " ↓") : "";
    h += "<th" + (c.cls ? ' class="' + c.cls + (sortable ? "" : " nosort") + '"' : (sortable ? "" : ' class="nosort"')) +
         (sortable ? ' data-sort="' + i + '"' : "") + ">" + esc(c.label) + arrow + "</th>";
  });
  h += "</tr></thead><tbody>";
  if (!rows.length) {
    h += '<tr><td colspan="' + cols.length + '" class="empty">Nothing here yet.</td></tr>';
  }
  rows.forEach(function (r) {
    h += "<tr>" + cols.map(function (c) { return c.cell(r); }).join("") + "</tr>";
  });
  h += "</tbody></table>";
  if (capped) h += '<div class="more-row"><button type="button" class="ghost" data-more>Show all ' + total + " rows</button></div>";
  return h;
}
document.addEventListener("click", function (e) {
  var th = e.target.closest ? e.target.closest("th[data-sort]") : null;
  if (!th) return;
  var box = th.closest(".scroll"), t = TABLES[box.id];
  var i = +th.dataset.sort;
  if (t.sort === i) t.dir = -t.dir; else { t.sort = i; t.dir = t.cols[i].defaultDir || 1; }
  box.innerHTML = tableHTML(box.id);
});

// ---------------------------------------------------------------------------
// charts (plain SVG, no dependencies)
// ---------------------------------------------------------------------------

// series: [{label, color, points:[{x (ms), y, title}]}]
// Draw a chart at (about) the width it will be shown. A fixed 720-unit drawing
// squeezed into a 320px phone shrinks its 10px labels to 4px.
function chartWidth() {
  var w = (window.innerWidth || 1000) - 2 * 16 - 2 * 18 - 2;   // page gutter, card padding, border
  return Math.max(300, Math.min(720, w));
}

// Time charts squeeze a whole season into a sliver of a many-year axis, so a line between two nights
// of one season looks like a vertical smear. All-years view therefore shows dots only; picking a
// season (the buttons above each time chart) zooms to it and draws the line, so the progression
// through the season reads. It is one setting for the page, and a new page starts on All years.
var chartYear = null;
var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function yearOf(x) { return new Date(x).getUTCFullYear(); }
function seasonBar(years) {
  return '<div class="seasons" role="group" aria-label="Season">' +
    '<button type="button" data-year="all" class="' + (chartYear == null ? "on" : "") + '" aria-pressed="' + (chartYear == null) + '">All years</button>' +
    years.map(function (y) {
      var on = y === chartYear;
      return '<button type="button" data-year="' + y + '" class="' + (on ? "on" : "") + '" aria-pressed="' + on + '">' + y + "</button>";
    }).join("") + "</div>";
}
function monthTicks(x0, x1) {
  var out = [], d = new Date(x0);
  d = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1);
  for (; d <= x1; d = Date.UTC(new Date(d).getUTCFullYear(), new Date(d).getUTCMonth() + 1, 1)) {
    out.push({ x: d, label: MONTHS[new Date(d).getUTCMonth()] });
  }
  return out;
}

function lineChart(series, opts) {
  opts = opts || {};
  var W = chartWidth(), H = opts.height || 230, P = { t: 12, r: 14, b: 26, l: 46 };
  // opts.trend: one point per season, joined across seasons (a gap of more than a year and a bit breaks the
  // line), so there is nothing to zoom into.
  var timeAxis = !!(opts.xTicks && opts.xTicks.length), bar = "", zoomed = timeAxis && !opts.trend && chartYear != null;
  if (timeAxis && !opts.trend) {
    var seen = {};
    series.forEach(function (s) { s.points.forEach(function (p) { seen[yearOf(p.x)] = 1; }); });
    var seasons = Object.keys(seen).map(Number).sort(function (a, b) { return a - b; });
    if (seasons.length > 1 || zoomed) bar = seasonBar(seasons);
    if (zoomed) {
      series = series.map(function (s) {
        var c = {}; for (var k in s) c[k] = s[k];
        c.points = s.points.filter(function (p) { return yearOf(p.x) === chartYear; });
        return c;
      });
    }
  }
  var pts = [];
  series.forEach(function (s) { s.points.forEach(function (p) { pts.push(p); }); });
  if (!pts.length) return bar + (zoomed ? '<div class="empty">No results in ' + chartYear + ".</div>" : '<div class="empty">Not enough data to plot.</div>');

  var xs = pts.map(function (p) { return p.x; }), ys = pts.map(function (p) { return p.y; });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  var fixed = opts.y0 != null && opts.y1 != null;
  var y0 = opts.y0 != null ? opts.y0 : Math.min.apply(null, ys);
  var y1 = opts.y1 != null ? opts.y1 : Math.max.apply(null, ys);
  if (y1 === y0) { y1 = y0 + 1; }
  if (!fixed) { var padY = (y1 - y0) * 0.08; y0 -= padY; y1 += padY; }
  // Time charts always span every season on record, so the axis is the same on
  // every page and a racer who sat a year out shows the gap instead of
  // silently shrinking the chart to the years they raced.
  if (zoomed) {
    x0 -= 10 * 864e5; x1 += 10 * 864e5;                      // one season: a little air either side
    if (x1 - x0 < 60 * 864e5) { var mid = (x0 + x1) / 2; x0 = mid - 30 * 864e5; x1 = mid + 30 * 864e5; }
  } else if (timeAxis && YEAR_LIST.length) {
    x0 = Math.min(x0, Date.parse(YEAR_LIST[YEAR_LIST.length - 1] + "-01-01"));
    x1 = Math.max(x1, Date.parse((YEAR_LIST[0] + 1) + "-01-01"));
  }
  if (x1 === x0) { x0 -= 1; x1 += 1; }

  var X = function (v) { return P.l + (v - x0) / (x1 - x0) * (W - P.l - P.r); };
  var Y = function (v) { return P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b); };

  var svg = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' +
            esc(opts.label || "chart") + '">';

  for (var i = 0; i <= 4; i++) {
    var v = y0 + (y1 - y0) * i / 4, y = Y(v);
    svg += '<line class="gridline" x1="' + P.l + '" y1="' + y + '" x2="' + (W - P.r) + '" y2="' + y + '"/>';
    svg += '<text x="' + (P.l - 6) + '" y="' + (y + 3) + '" text-anchor="end">' +
           esc((opts.fmtY || String)(v)) + "</text>";
  }
  svg += '<line class="axis" x1="' + P.l + '" y1="' + (H - P.b) + '" x2="' + (W - P.r) + '" y2="' + (H - P.b) + '"/>';

  // Label every year when they fit, else every second or third one, counting back from the newest.
  var ticks = (zoomed ? monthTicks(x0, x1) : (opts.xTicks || [])).filter(function (t) { return t.x >= x0 && t.x <= x1; });
  var gap = 1e9;
  ticks.forEach(function (t, i) { if (i) gap = Math.min(gap, X(t.x) - X(ticks[i - 1].x)); });
  var every = Math.max(1, Math.ceil(34 / gap));
  ticks.forEach(function (t, i) {
    if ((ticks.length - 1 - i) % every) return;
    svg += '<text x="' + X(t.x) + '" y="' + (H - P.b + 15) + '" text-anchor="middle">' + esc(t.label) + "</text>";
  });

  series.forEach(function (s) {
    var p = s.points.slice().sort(function (a, b) { return a.x - b.x; });
    if (p.length > 1 && !opts.scatter && (zoomed || !timeAxis || opts.trend)) {
      // Break the line at every season boundary. The off-season is not a data
      // point, so a line from September to the next May would read as a trend
      // that never happened. The gap is only a safety net inside a season.
      var gap = opts.gapMs || 120 * 864e5;
      var d = "", prev = null;
      p.forEach(function (q) {
        var newSeason = !opts.trend && prev !== null && new Date(q.x).getUTCFullYear() !== new Date(prev).getUTCFullYear();
        d += (prev === null || newSeason || q.x - prev > gap ? "M" : "L") + X(q.x).toFixed(1) + " " + Y(q.y).toFixed(1) + " ";
        prev = q.x;
      });
      svg += '<path fill="none" style="stroke:' + s.color + '" stroke-width="1.75" stroke-linejoin="round"' +
             (s.dash ? ' stroke-dasharray="' + s.dash + '"' : "") + ' d="' + d.trim() + '"/>';
    }
    p.forEach(function (q) {
      var cx = X(q.x).toFixed(1), cy = Y(q.y).toFixed(1), t = esc(q.title || "");
      // The tooltip only exists for a mouse; a tap shows the same text in the
      // readout (see the click handler, which picks the nearest dot).
      svg += '<circle class="pt" cx="' + cx + '" cy="' + cy + '" r="' + (opts.scatter ? 3 : 3.4) +
             '" style="fill:' + s.color + '" data-t="' + t + '"><title>' + t + "</title></circle>";
    });
  });
  return bar + svg + "</svg>" + '<div class="chart-readout" role="status" aria-live="polite">Tap a point to see its race.</div>';
}

function legend(series) {
  return '<div class="legend">' + series.map(function (s) {
    return '<span class="pill"><span class="dot" style="background:' + s.color +
           (s.dash ? ";outline:1px dashed var(--ink-3);outline-offset:1px" : "") + '"></span>' +
           esc(s.label) + "</span>";
  }).join("") + "</div>";
}

function yearTicks() {
  return YEAR_LIST.slice().sort(function (a, b) { return a - b; }).map(function (y) {
    return { x: Date.parse(y + "-07-01"), label: String(y) };
  });
}

// ---------------------------------------------------------------------------
// head-to-head
// ---------------------------------------------------------------------------

function meetings(a, b) {
  // Keyed by division, not race night: sharing a start line while racing
  // different distances is not a head to head.
  var mine = rowsOf(a).filter(inPerson), theirs = {}, out = [];
  rowsOf(b).forEach(function (r) { theirs[r.div] = r; });
  mine.forEach(function (r) {
    var o = theirs[r.div];
    if (o && r.dplace && o.dplace) out.push({ race: raceById[r.raceid], grp: r.grp, a: r, b: o });
  });
  out.sort(function (x, y) { return (x.race.date || "").localeCompare(y.race.date || ""); });
  return out;
}

function record(a, b) {
  var m = meetings(a, b), w = 0, l = 0;
  m.forEach(function (x) { if (x.a.dplace < x.b.dplace) w++; else l++; });
  return { met: m.length, wins: w, losses: l, meetings: m };
}

// Everyone a racer has lined up against, ranked by how often.
function rivals(key) {
  var mine = rowsOf(key).filter(inPerson), tally = {};
  mine.forEach(function (r) {
    (resultsByDiv[r.div] || []).forEach(function (o) {
      if (o.racer === key || !o.dplace || !r.dplace) return;
      var t = tally[o.racer] || (tally[o.racer] = { racer: o.racer, met: 0, wins: 0, losses: 0, margin: 0 });
      t.met++;
      if (r.dplace < o.dplace) t.wins++; else t.losses++;
      if (r.seconds && o.seconds) t.margin += o.seconds - r.seconds;
    });
  });
  return Object.keys(tally).map(function (k) {
    var t = tally[k];
    t.rate = t.met ? t.wins / t.met : 0;
    t.avgMargin = t.met ? t.margin / t.met : 0;
    return t;
  }).sort(function (x, y) { return y.met - x.met; });
}

// ---------------------------------------------------------------------------
// views
// ---------------------------------------------------------------------------

var views = {};

views.racer = function (key) {
  if (!key) return pickRacer();
  var rows = resultsByRacer[key];
  if (!rows) return '<div class="card"><h2>Not found</h2><p class="hint">No results for that racer.</p></div>' + pickRacer();

  var multiSport = new Set(rows.map(function (r) { return evOf(raceById[r.raceid]); })).size > 1;
  rows = rows.filter(passRow).sort(function (a, b) {
    return (raceById[b.raceid].date || "").localeCompare(raceById[a.raceid].date || "");
  });
  var bar = multiSport || discFilter !== "all" ? filterBar() : "";
  if (!rows.length) {
    return bar + '<div class="card"><h2>' + esc(nameOf(key)) + '</h2><p class="hint">No ' +
           esc(filterName()) + " results for this racer.</p></div>";
  }

  var wins = rows.filter(isWin).length;
  var podiums = rows.filter(isPodium).length;
  var best = rows.reduce(function (m, r) { return r.dplace && (m == null || r.dplace < m) ? r.dplace : m; }, null);
  var pcts = rows.map(function (r) { return r.pct; }).filter(function (v) { return v != null; });
  var yrs = rows.map(function (r) { return raceById[r.raceid].year; }).filter(Boolean);
  var span = yrs.length ? Math.min.apply(null, yrs) + "–" + Math.max.apply(null, yrs) : "—";

  var h = bar + '<div class="card">';
  h += '<p class="big-name">' + esc(nameOf(key)) + "</p>";
  var perDisc = {};
  rows.forEach(function (r) { var d = evOf(raceById[r.raceid]); perDisc[d] = (perDisc[d] || 0) + 1; });
  var discNote = Object.keys(perDisc).sort(function (a, b) { return perDisc[b] - perDisc[a]; })
    .map(function (d) { return perDisc[d] + " " + (DISC_NAMES[d] || d); }).join(" · ");
  h += '<p class="hint">' + span + " · " + rows.length + " starts" + (discNote ? " (" + discNote + ")" : "") + "</p>";
  h += '<div class="stats">' +
       stat(rows.length, "Starts") + stat(wins, "Wins") + stat(podiums, "Podiums") +
       stat(best == null ? "—" : best, "Best finish") +
       stat(fmtPct(median(pcts)), "Median finish") +
       stat(new Set(rows.map(function (r) { return raceById[r.raceid].course; }).filter(Boolean)).size, "Courses") +
       "</div></div>";

  // Which distances they actually ride. Everything else on this page is
  // computed inside a distance, so this is the key to reading the rest.
  var grpTally = {};
  rows.forEach(function (r) { grpTally[r.grp] = (grpTally[r.grp] || 0) + 1; });
  var grpKeys = Object.keys(grpTally).sort(function (a, b) { return grpTally[b] - grpTally[a] || byLongest(a, b); });
  if (grpKeys.length) {
    h += '<div class="card"><h2>Events</h2>' +
      '<p class="hint">Each night splits into start-line groups by distance, and the sports run ' +
      'on different nights. Placings, rivals and head to head on this page only ever compare ' +
      'riders in the same group that night.</p><div class="stats">' +
      grpKeys.map(function (n) {
        var pct = median(rows.filter(function (r) { return r.grp === n; })
                             .map(function (r) { return r.pct; }).filter(function (v) { return v != null; }));
        return stat(grpTally[n], grpLabel(n) + " \u00b7 " + fmtPct(pct));
      }).join("") + "</div></div>";
  }

  // How they finish, over time.
  var NO_COURSE = "Course not listed";
  var byCourse = {};
  rows.forEach(function (r) {
    // Race titles only name a course from 2023, and cross never does. Percentile
    // does not depend on the course, so those races still count.
    var c = raceById[r.raceid].course || NO_COURSE; if (r.pct == null) return;
    (byCourse[c] = byCourse[c] || []).push({
      x: Date.parse(raceById[r.raceid].date), y: r.pct * 100,
      title: fmtDate(raceById[r.raceid].date) + " · " + c + " · " + grpLabel(r.grp) + " · " + r.dplace + "/" + r.field
    });
  });
  var series = Object.keys(byCourse).sort().map(function (c) {
    return { label: c, color: courseColor(c), points: byCourse[c] };
  });
  h += '<div class="card"><h2>Where they finish</h2>' +
       '<p class="hint">Percentile in the field — 100% is the win, 0% is last. Coloured by course; grey where the race title names none.</p>' +
       lineChart(series, { scatter: true, y0: 0, y1: 100, xTicks: yearTicks(),
                           fmtY: function (v) { return Math.round(v) + "%"; }, label: "Finish percentile over time" }) +
       legend(series) + "</div>";

  // Same course, different years: the question that needs a chart.
  // Split by distance as well as course: a 3-lap night and a 4-lap night on
  // the same course are different races, and plotting them as one line would
  // show a "trend" that is really just a lap count changing.
  var DASH_CYCLE = ["", "6 3", "2 3", "10 4", "1 3"];
  var timeSeries = [];
  Object.keys(byCourse).sort().forEach(function (c) {
    grpKeys.forEach(function (n, gi) {
      var pts = rows.filter(function (r) {
        return raceById[r.raceid].course === c && r.grp === n && r.seconds;
      }).map(function (r) {
        return { x: Date.parse(raceById[r.raceid].date), y: r.seconds,
                 title: fmtDate(raceById[r.raceid].date) + " \u00b7 " + c + " \u00b7 " + grpLabel(n) + " \u00b7 " +
                        fmtTime(r.seconds) + " \u00b7 " + r.dplace + "/" + r.field };
      });
      if (pts.length > 1) {
        timeSeries.push({ label: c + " \u00b7 " + grpLabel(n), color: courseColor(c),
                          dash: DASH_CYCLE[gi % DASH_CYCLE.length], points: pts });
      }
    });
  });

  if (timeSeries.length) {
    h += '<div class="card"><h2>Times by course and distance</h2>' +
         '<p class="hint">Treat across-season comparisons loosely. A course keeps its name ' +
         'year to year and runs roughly the same terrain, but the loop gets re-cut, so the ' +
         'oldest "Red on Black" is not the same lap as the newest one. Within a season, where the ' +
         'same course repeats, the times really are comparable. Finish percentile is the ' +
         'honest way to read across years.</p>' +
         lineChart(timeSeries, { xTicks: yearTicks(), fmtY: fmtTime, label: "Finish time by course over time" }) +
         legend(timeSeries) + "</div>";
  }

  // Rivals - the "who beat who" table.
  var rv = rivals(key).filter(function (t) { return t.met >= 2; });
  h += '<div class="card"><h2>Rivals</h2>' +
       '<p class="hint">Everyone ' + esc(nameOf(key)) + " has shared a start line with at least twice. " +
       "Click a name for the full head-to-head.</p>" +
       table([
         { label: "Racer", get: function (t) { return nameOf(t.racer); },
           cell: function (t) { return "<td>" + racerLink(t.racer) + "</td>"; } },
         { label: "Met", cls: "num", get: function (t) { return t.met; }, defaultDir: -1,
           cell: function (t) { return '<td class="num">' + t.met + "</td>"; } },
         { label: "W–L", cls: "num", get: function (t) { return t.wins - t.losses; }, defaultDir: -1,
           cell: function (t) { return '<td class="num"><span class="win">' + t.wins + '</span>–<span class="loss">' +
                  t.losses + "</span></td>"; } },
         { label: "Win rate", cls: "num", get: function (t) { return t.rate; }, defaultDir: -1,
           cell: function (t) { return '<td class="num">' + Math.round(t.rate * 100) + "%</td>"; } },
         { label: "Avg margin", cls: "num", get: function (t) { return t.avgMargin; }, defaultDir: -1,
           cell: function (t) { return '<td class="num ' + (t.avgMargin >= 0 ? "win" : "loss") + '">' +
                  (t.avgMargin >= 0 ? "+" : "−") + fmtTime(Math.abs(t.avgMargin)) + "</td>"; } },
         { label: "", cls: "num",
           cell: function (t) { return '<td class="num"><a href="#/h2h/' + esc(key) + "/" + esc(t.racer) + '">H2H</a></td>'; } }
       ], rv, { sort: 1, dir: -1, limit: 40 }) + "</div>";


  // Does weather move this racer? Percentile is the right measure: it is
  // immune to a course being long, which raw time is not.
  var withWx = rows.filter(function (r) { return raceById[r.raceid].weather && r.pct != null; });
  if (withWx.length >= 6) {
    var BANDS = [
      { label: "Under 60°F", test: function (w) { return w.temp != null && w.temp < 60; } },
      { label: "60–69°F", test: function (w) { return w.temp >= 60 && w.temp < 70; } },
      { label: "70–79°F", test: function (w) { return w.temp >= 70 && w.temp < 80; } },
      { label: "80°F and up", test: function (w) { return w.temp >= 80; } },
      { label: "Wet", test: function (w) { return isWet(w); } },
      { label: "Dry", test: function (w) { return !isWet(w); } },
      { label: "Sun", test: function (w) { return /sunny/i.test(w.sky || ""); } },
      { label: "Cloud or overcast", test: function (w) { return /cloudy|overcast/i.test(w.sky || ""); } }
    ];
    var bandRows = BANDS.map(function (band) {
      var hits = withWx.filter(function (r) { return band.test(raceById[r.raceid].weather); });
      return { label: band.label, n: hits.length,
               pct: median(hits.map(function (r) { return r.pct; })),
               ratio: median(hits.map(function (r) { return r.ratio; }).filter(Boolean)) };
    }).filter(function (b) { return b.n > 0; });

    h += '<div class="card"><h2>Conditions</h2>' +
      '<p class="hint">How ' + esc(nameOf(key)) + " finishes in different weather at the 6pm gun. " +
      "Small samples swing wildly — read the race count before reading anything into a row.</p>" +
      table([
        { label: "Conditions", cell: function (b) { return "<td>" + esc(b.label) + "</td>"; } },
        { label: "Races", cls: "num", get: function (b) { return b.n; }, defaultDir: -1,
          cell: function (b) { return '<td class="num">' + b.n + "</td>"; } },
        { label: "Median finish", cls: "num", get: function (b) { return b.pct; }, defaultDir: -1,
          cell: function (b) { return '<td class="num">' + fmtPct(b.pct) + "</td>"; } },
        { label: "vs winner", cls: "num", get: function (b) { return b.ratio; },
          cell: function (b) { return '<td class="num">' + (b.ratio ? b.ratio.toFixed(2) + "×" : "—") + "</td>"; } }
      ], bandRows, { sort: null }) + "</div>";
  }

  // Per-course summary.
  var courseRows = [];
  Object.keys(byCourse).sort().forEach(function (c) {
    grpKeys.forEach(function (g) {
      var rs = rows.filter(function (r) { return raceById[r.raceid].course === c && r.grp === g; });
      if (!rs.length) return;
      var secs = rs.map(function (r) { return r.seconds; }).filter(Boolean);
      var ratios = rs.map(function (r) { return r.ratio; }).filter(Boolean);
      courseRows.push({
        course: c, grp: g, n: rs.length,
        best: secs.length ? Math.min.apply(null, secs) : null,
        bestPlace: rs.reduce(function (m, r) { return r.dplace && (m == null || r.dplace < m) ? r.dplace : m; }, null),
        ratio: ratios.length ? median(ratios) : null,
        pct: median(rs.map(function (r) { return r.pct; }).filter(function (v) { return v != null; }))
      });
    });
  });
  h += '<div class="card"><h2>By course</h2>' +
       '<p class="hint">One row per course and event. "vs winner" is the median of this racer\'s time divided by the winning time of that distance — ' +
       "1.00 means they won, 1.20 means they took 20% longer.</p>" +
       table([
         { label: "Course", get: function (r) { return r.course; }, cell: function (r) { return "<td>" + coursePill(r.course, r) + "</td>"; } },
         { label: "Event", get: function (r) { return grpRank(r.grp); }, defaultDir: -1, cell: function (r) { return grpCell(r.grp); } },
         { label: "Races", cls: "num", get: function (r) { return r.n; }, defaultDir: -1, cell: function (r) { return '<td class="num">' + r.n + "</td>"; } },
         { label: "Best time", cls: "num", get: function (r) { return r.best; }, cell: function (r) { return '<td class="num">' + fmtTime(r.best) + "</td>"; } },
         { label: "Best place", cls: "num", get: function (r) { return r.bestPlace; }, cell: function (r) { return '<td class="num">' + (r.bestPlace || "—") + "</td>"; } },
         { label: "vs winner", cls: "num", get: function (r) { return r.ratio; }, cell: function (r) { return '<td class="num">' + (r.ratio ? r.ratio.toFixed(2) + "×" : "—") + "</td>"; } },
         { label: "Median finish", cls: "num", get: function (r) { return r.pct; }, defaultDir: -1, cell: function (r) { return '<td class="num">' + fmtPct(r.pct) + "</td>"; } }
       ], courseRows, { sort: 1, dir: -1 }) + "</div>";

  // Every start.
  h += '<div class="card"><h2>Every start</h2>' +
       table([
         { label: "Date", get: function (r) { return raceById[r.raceid].date; }, defaultDir: -1,
           cell: function (r) { return '<td><a href="#/race/' + r.raceid + '">' + fmtDate(raceById[r.raceid].date) + "</a></td>"; } },
         { label: "Course", get: function (r) { return raceById[r.raceid].course; },
           cell: function (r) { return "<td>" + coursePill(raceById[r.raceid].course, raceById[r.raceid]) + "</td>"; } },
         { label: "Event", get: function (r) { return grpRank(r.grp); }, defaultDir: -1,
           cell: function (r) { return grpCell(r.grp); } },
         { label: "Place", cls: "num", get: function (r) { return r.dplace; },
           cell: function (r) { return placeCell(r); } },
         { label: "Time", cls: "num", get: function (r) { return r.seconds; },
           cell: function (r) { return '<td class="num">' + fmtTime(r.seconds) + "</td>"; } },
         { label: "Behind", cls: "num", get: function (r) { return r.gap; },
           cell: function (r) { return '<td class="num muted">' + fmtGap(r.gap) + "</td>"; } },
         { label: "Finish", cls: "num", get: function (r) { return r.pct; }, defaultDir: -1,
           cell: function (r) { return '<td class="num">' + fmtPct(r.pct) + "</td>"; } },
         { label: "Weather", get: function (r) { var w = raceById[r.raceid].weather; return w ? w.temp : null; },
           cell: function (r) { return wxCell(raceById[r.raceid]); } }
       ], rows, { sort: 0, dir: -1 }) + "</div>";

  return h;
};

function stat(n, label, word) {
  return '<div class="stat"><div class="n' + (word ? " word" : "") + '">' + esc(n) +
         '</div><div class="l">' + esc(label) + "</div></div>";
}

function pickRacer() {
  var keys = RACER_KEYS.filter(function (k) { return rowsOf(k).length; })
    .sort(function (a, b) { return rowsOf(b).length - rowsOf(a).length; });
  function pcts(k) { return rowsOf(k).map(function (r) { return r.pct; }).filter(function (v) { return v != null; }); }
  function wins(k) { return rowsOf(k).filter(isWin).length; }
  function seasons(k) { return new Set(rowsOf(k).map(function (r) { return raceById[r.raceid].year; })).size; }
  return '<div class="card"><h2>Find a racer</h2>' +
    '<p class="hint">' + RACER_KEYS.length + " people have results here. Start typing a name.</p>" +
    '<input type="search" id="racer-search" placeholder="e.g. Super Person" autocomplete="off">' +
    '<div id="racer-hits"></div></div>' +
    allRoundersCard() +
    filterBar() +
    '<div class="card"><h2>Most starts' + (filterName() ? ", " + esc(filterName()) : ", all time") + "</h2>" +
    table([
      { label: "Racer", get: function (k) { return nameOf(k); }, cell: function (k) { return "<td>" + racerLink(k) + "</td>"; } },
      { label: "Starts", cls: "num", get: function (k) { return rowsOf(k).length; }, defaultDir: -1,
        cell: function (k) { return '<td class="num">' + rowsOf(k).length + "</td>"; } },
      { label: "Wins", cls: "num", get: wins, defaultDir: -1,
        cell: function (k) { return '<td class="num">' + wins(k) + "</td>"; } },
      { label: "Median finish", cls: "num", get: function (k) { return median(pcts(k)); }, defaultDir: -1,
        cell: function (k) { return '<td class="num">' + fmtPct(median(pcts(k))) + "</td>"; } },
      { label: "Seasons", cls: "num", get: seasons, defaultDir: -1,

views.h2h = function (a, b) {
  if (a === "-") a = "";   // "-" stands for "nobody picked yet" in the URL
  if (b === "-") b = "";
  var h = filterBar() + '<div class="card"><h2>Head to head</h2>' +
    '<p class="hint">Pick two people: start typing a name. Only counts nights they both finished <em>and</em> ' +
    'raced the same distance — sharing a start line at different distances is not a race.</p>' +
    '<div class="row">' +
    racerPicker("h2h-a", a) + racerPicker("h2h-b", b) + "</div></div>";

  if (!a || !b) return h;
  if (a === b) return h + '<div class="card"><p class="empty">Pick two different racers.</p></div>';
  if (!resultsByRacer[a] || !resultsByRacer[b]) return h + '<div class="card"><p class="empty">No results for one of those racers.</p></div>';

  var rec = record(a, b);
  if (!rec.met) {
    return h + '<div class="card"><p class="empty">' + esc(nameOf(a)) + " and " + esc(nameOf(b)) +
           " have never finished the same race.</p></div>";
  }

  var margins = rec.meetings.filter(function (m) { return m.a.seconds && m.b.seconds; })
    .map(function (m) { return m.b.seconds - m.a.seconds; });

  h += '<div class="card"><h2>' + esc(nameOf(a)) + " vs " + esc(nameOf(b)) + "</h2>" +
    '<div class="stats">' +
    stat(rec.met, "Races together") +
    stat(rec.wins, nameOf(a).split(" ")[0] + " ahead") +
    stat(rec.losses, nameOf(b).split(" ")[0] + " ahead") +
    stat(Math.round(rec.wins / rec.met * 100) + "%", "Win rate") +
    stat(margins.length ? (median(margins) >= 0 ? "+" : "−") + fmtTime(Math.abs(median(margins))) : "—", "Median margin") +
    "</div></div>";

  var pts = rec.meetings.filter(function (m) { return m.a.seconds && m.b.seconds; }).map(function (m) {
    return { x: Date.parse(m.race.date), y: m.b.seconds - m.a.seconds,
             title: fmtDate(m.race.date) + " · " + (m.race.course || "") + " · " +
                    (m.a.dplace < m.b.dplace ? nameOf(a) : nameOf(b)) + " ahead by " +
                    fmtTime(Math.abs(m.b.seconds - m.a.seconds)) };
  });
  if (pts.length > 1) {
    h += '<div class="card"><h2>Margin over time</h2>' +
      '<p class="hint">Above the line means ' + esc(nameOf(a)) + " finished ahead.</p>" +
      lineChart([{ label: "margin", color: "var(--accent)", points: pts }],
                { xTicks: yearTicks(), fmtY: function (v) { return (v >= 0 ? "+" : "−") + fmtTime(Math.abs(v)); },
                  label: "Head to head margin over time" }) + "</div>";
  }

  h += '<div class="card"><h2>Every meeting</h2>' +
    table([
      { label: "Date", get: function (m) { return m.race.date; }, defaultDir: -1,
        cell: function (m) { return '<td><a href="#/race/' + m.race.raceid + '">' + fmtDate(m.race.date) + "</a></td>"; } },
      { label: "Course", get: function (m) { return m.race.course; },
        cell: function (m) { return "<td>" + coursePill(m.race.course, m.race) + "</td>"; } },
      { label: "Event", get: function (m) { return grpRank(m.grp); }, defaultDir: -1,
        cell: function (m) { return grpCell(m.grp); } },
      { label: "Ahead", get: function (m) { return m.a.dplace < m.b.dplace ? 0 : 1; },
        cell: function (m) { var w = m.a.dplace < m.b.dplace;
          return '<td class="' + (w ? "win" : "loss") + '">' + esc(nameOf(w ? a : b)) + "</td>"; } },
      { label: nameOf(a).split(" ")[0], cls: "num", get: function (m) { return m.a.dplace; },
        cell: function (m) { return placeCell(m.a); } },
      { label: nameOf(b).split(" ")[0], cls: "num", get: function (m) { return m.b.dplace; },
        cell: function (m) { return placeCell(m.b); } },
      { label: "Margin", cls: "num",
        get: function (m) { return (m.a.seconds && m.b.seconds) ? Math.abs(m.b.seconds - m.a.seconds) : null; },
        cell: function (m) {
          if (!m.a.seconds || !m.b.seconds) return '<td class="num muted">—</td>';
          return '<td class="num">' + fmtTime(Math.abs(m.b.seconds - m.a.seconds)) + "</td>"; } }
    ], rec.meetings, { sort: 0, dir: -1 }) + "</div>";

  return h;
};

// A type-to-search box in place of a drop-down of everyone.
function racerPicker(id, val) {
  return '<div class="picker">' +
    '<input type="text" class="picker-input" id="' + id + '" role="combobox" aria-expanded="false" ' +
    'aria-autocomplete="list" aria-controls="' + id + '-list" aria-label="Racer name" ' +
    'autocomplete="off" spellcheck="false" placeholder="Type a name…" ' +
    'value="' + esc(val ? nameOf(val) : "") + '" data-key="' + esc(val || "") + '">' +
    '<ul class="picker-list" id="' + id + '-list" role="listbox" hidden></ul></div>';
}

function wirePickers() {
  var inputs = document.querySelectorAll ? document.querySelectorAll(".picker-input") : [];
  Array.prototype.forEach.call(inputs, function (input) {
    var list = document.getElementById(input.id + "-list"), items = [], active = -1;

    function close() {
      list.hidden = true; active = -1;
      input.setAttribute("aria-expanded", "false");
      input.removeAttribute("aria-activedescendant");
    }
    function paint() {
      list.innerHTML = items.length ? items.map(function (e, i) {
        return '<li role="option" id="' + input.id + "-opt" + i + '" data-key="' + esc(e.key) +
               '" aria-selected="' + (i === active) + '"><span>' + esc(e.name) + '</span>' +
               '<span class="muted">' + e.starts + " start" + (e.starts === 1 ? "" : "s") + "</span></li>";
      }).join("") : '<li class="none">No one by that name</li>';
      list.hidden = false;
      input.setAttribute("aria-expanded", "true");
      if (active >= 0) input.setAttribute("aria-activedescendant", input.id + "-opt" + active);
    }
    function pick(key) {
      input.dataset.key = key;
      input.value = nameOf(key);
      close();
      var a = document.getElementById("h2h-a").dataset.key || "-";
      var b = document.getElementById("h2h-b").dataset.key || "-";
      location.hash = "#/h2h/" + a + "/" + b;
    }
    function restore() { input.value = input.dataset.key ? nameOf(input.dataset.key) : ""; }

    input.addEventListener("input", debounce(function () {
      var q = input.value.trim();
      if (!q) { items = []; close(); return; }
      items = searchRacers(q, 8);
      active = items.length ? 0 : -1;
      paint();
    }, 120));
    input.addEventListener("focus", function () { input.select(); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!items.length || list.hidden) return;
        e.preventDefault();
        active = (active + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        paint();
      } else if (e.key === "Enter") {
        if (!list.hidden && active >= 0 && items[active]) { e.preventDefault(); pick(items[active].key); }
      } else if (e.key === "Escape") {
        close(); restore();
      }
    });
    // mousedown only keeps the input focused so its blur does not close the list
    // before the tap lands; the pick itself is the click. (A finger dragging the
    // list to scroll it fires neither, so scrolling never selects by accident.)
    list.addEventListener("mousedown", function (e) { e.preventDefault(); });
    list.addEventListener("click", function (e) {
      var li = e.target && e.target.closest ? e.target.closest("li[data-key]") : null;
      if (li) pick(li.dataset.key);
    });
    input.addEventListener("blur", function () {
      setTimeout(function () { close(); restore(); }, 120);
    });
  });
}

views.course = function (cslug) {
  if (!cslug) {
    var rows = COURSE_NAMES.map(function (c) {
      var rs = courses[c].filter(passRace);
      var ys = rs.map(function (r) { return r.year; }).filter(Boolean);
      return { course: c, n: rs.length, years: new Set(ys).size,
               from: ys.length ? Math.min.apply(null, ys) : null, to: ys.length ? Math.max.apply(null, ys) : null };
    }).filter(function (r) { return r.n; });
    return filterBar() + '<div class="card"><h2>Courses</h2>' +
      '<p class="hint">The series rotates courses between seasons but repeats them within one, ' +
      "so a course page is where times actually compare.</p>" +
      table([
        { label: "Course", get: function (r) { return r.course; }, cell: function (r) { return "<td>" + coursePill(r.course, r) + "</td>"; } },
        { label: "Races", cls: "num", get: function (r) { return r.n; }, defaultDir: -1, cell: function (r) { return '<td class="num">' + r.n + "</td>"; } },
        { label: "Seasons", cls: "num", get: function (r) { return r.years; }, defaultDir: -1, cell: function (r) { return '<td class="num">' + r.years + "</td>"; } },
        { label: "Years", get: function (r) { return r.from; },
          cell: function (r) { return '<td class="muted">' + (r.from ? r.from + "–" + r.to : "—") + "</td>"; } }
      ], rows, { sort: 1, dir: -1 }) + "</div>";
  }

  var name = COURSE_NAMES.filter(function (c) { return slug(c) === cslug; })[0];
  if (!name) return '<div class="card"><h2>Unknown course</h2></div>' + views.course();

  var rs = courses[name].filter(passRace);
  if (!rs.length) {
    return filterBar() + '<div class="card"><h2>' + esc(name) + '</h2><p class="hint">No ' +
           esc(filterName()) + " races on this course.</p></div>";
  }
  var ids = {}; rs.forEach(function (r) { ids[r.raceid] = 1; });
  var all = RESULTS.filter(function (r) { return ids[r.raceid] && r.seconds; });
  var fastest = all.slice().sort(function (a, b) { return a.seconds - b.seconds; });

  // Times here are only comparable within a start-line group.
  var grpSet = {};
  all.forEach(function (r) { grpSet[r.grp] = 1; });
  var grpList = Object.keys(grpSet).sort(byLongest);
  function bestAt(n) {
    var g = all.filter(function (r) { return r.grp === n; });
    return g.length ? Math.min.apply(null, g.map(function (r) { return r.seconds; })) : null;
  }
  var rank = {};
  fastest.forEach(function (r, i) { rank[r.raceid + "|" + r.racer] = i + 1; });

  var h = filterBar() + '<div class="card"><p class="big-name">' +
    '<span class="dot" style="display:inline-block;background:' + courseColor(name) + '"></span> ' + esc(name) + "</p>" +
    '<p class="hint">' + rs.length + " races · " +
    new Set(rs.map(function (r) { return r.year; })).size + " seasons</p>" +
    '<div class="stats">' +
    stat(rs.length, "Races") +
    stat(new Set(all.map(function (r) { return r.racer; })).size, "Racers") +
    grpList.map(function (n) {
      var b = bestAt(n);
      return b == null ? "" : stat(fmtTime(b), "Best, " + grpLabel(n));
    }).join("") +
    "</div></div>";

  // Winning time by edition - is the course getting faster, or was it re-cut?
  var byRace = rs.slice().sort(function (a, b) { return (a.date || "").localeCompare(b.date || ""); });
  var DASH_CYCLE = ["", "6 3", "2 3", "10 4", "1 3"];
  var series = grpList.map(function (n, gi) {
    var pts = [];
    byRace.forEach(function (race) {
      // Only a race of the same sport can hold this group ("Half" exists in both
      // MTB and trail run).
      if (evOf(race) !== discPart(n)) return;
      var g = (resultsByDiv[race.raceid + "|" + distPart(n)] || []).filter(function (r) { return r.seconds; });
      if (!g.length) return;
      var w = Math.min.apply(null, g.map(function (r) { return r.seconds; }));
      pts.push({ x: Date.parse(race.date), y: w,
                 title: fmtDate(race.date) + " · " + grpLabel(n) + " · winner " + fmtTime(w) +
                        " · " + g.length + " riders" });
    });
    return { label: "Winning time, " + grpLabel(n), color: courseColor(name),
             dash: DASH_CYCLE[gi % DASH_CYCLE.length], points: pts };
  }).filter(function (x) { return x.points.length; });

  h += '<div class="card"><h2>How the course has run</h2>' +
    '<p class="hint">Winning time per distance, for every running of this course. Read it ' +
    "within a season with confidence; across seasons only loosely — the course keeps its " +
    "name and rough terrain, but the loop gets re-cut, so a step between years is usually " +
    "the course changing rather than the field.</p>" +
    lineChart(series, { xTicks: yearTicks(), fmtY: fmtTime, label: "Winning and median time per edition" }) +
    legend(series) + "</div>";

  h += '<div class="card"><h2>Fastest times ever run here</h2>' +
    '<p class="hint">Sort by event first — a 4-lap time and a 1-lap time are not ' +
    "competing with each other.</p>" +
    table([
      { label: "#", cls: "num", get: function (r) { return rank[r.raceid + "|" + r.racer]; },
        cell: function (r) { return '<td class="num muted">' + rank[r.raceid + "|" + r.racer] + "</td>"; } },
      { label: "Racer", get: function (r) { return nameOf(r.racer); }, cell: function (r) { return "<td>" + racerLink(r.racer) + "</td>"; } },
      { label: "Event", get: function (r) { return grpRank(r.grp); }, defaultDir: -1,
           cell: function (r) { return grpCell(r.grp); } },
      { label: "Time", cls: "num", get: function (r) { return r.seconds; }, cell: function (r) { return '<td class="num">' + fmtTime(r.seconds) + "</td>"; } },
      { label: "Date", get: function (r) { return raceById[r.raceid].date; }, defaultDir: -1,
        cell: function (r) { return '<td><a href="#/race/' + r.raceid + '">' + fmtDate(raceById[r.raceid].date) + "</a></td>"; } },
      { label: "Place", cls: "num", get: function (r) { return r.dplace; }, cell: function (r) { return placeCell(r); } }
    ], fastest, { sort: 2, dir: 1, limit: 50 }) + "</div>";

  h += '<div class="card"><h2>Every running of ' + esc(name) + "</h2>" +
    table([
      { label: "Date", get: function (r) { return r.date; }, defaultDir: -1,
        cell: function (r) { return '<td><a href="#/race/' + r.raceid + '">' + fmtDate(r.date) + "</a></td>"; } },
      { label: "Season", cls: "num", get: function (r) { return r.year; }, defaultDir: -1,
        cell: function (r) { return '<td class="num"><a href="#/series/' + r.year + '">' + r.year + "</a></td>"; } },
      { label: "Finishers", cls: "num", get: function (r) { return (resultsByRace[r.raceid] || []).length; }, defaultDir: -1,
        cell: function (r) { return '<td class="num">' + (resultsByRace[r.raceid] || []).length + "</td>"; } },
      { label: "Weather", get: function (r) { return r.weather ? r.weather.temp : null; },
        cell: function (r) { return wxCell(r); } },
      { label: "Won by, longest distance", cell: function (r) {
          var n = (r.groups || [])[0];
          var w = n == null ? null : (resultsByDiv[r.raceid + "|" + n] || [])[0];
          return "<td>" + (w ? racerLink(w.racer) + ' <span class="muted">' + (n ? n + ", " : "") +
                 fmtTime(w.seconds) + "</span>" : "—") + "</td>"; } }
    ], byRace, { sort: 0, dir: -1 }) + "</div>";

  return h;
};

views.race = function (id) {
  var race = raceById[id];
  if (!race) return '<div class="card"><h2>Unknown race</h2></div>';
  var rows = resultsByRace[id] || [];
  var h = '<div class="card"><p class="big-name">' + fmtDate(race.date) + "</p>" +
    '<p class="hint">' + esc(race.title || "") + "</p>" +
    '<div class="row" style="margin-top:10px">' +
    '<div class="shrink">' + coursePill(race.course, race) + "</div>" +
    '<div class="shrink"><span class="pill">' + rows.length + " finishers</span></div>" +
    (race.weather ? '<div class="shrink">' + wxChip(race.weather) + "</div>" : "") +
    (race.discipline ? '<div class="shrink"><span class="pill">' + esc(DISC_NAMES[evOf(race)] || race.discipline) + "</span></div>" : "") +
    ((race.groups || []).length > 1
      ? '<div class="shrink"><span class="pill">' + race.groups.map(distLabel).map(esc).join(", ") + "</span></div>" : "") +
    (race.year ? '<div class="shrink"><a class="pill" href="#/series/' + race.year + '">' + race.year + " season</a></div>" : "") +
    (race.url ? '<div class="shrink"><a class="pill" href="' + esc(race.url) + '" target="_blank" rel="noopener">' +
      sourceName(race.url) + " ↗</a></div>" : "") +
    "</div></div>";
  if (race.virtual) {
    h += '<div class="card"><h2>A virtual week</h2><p class="hint">Riders timed themselves on this ' +
         "week's course whenever they could and sent in a time, so nobody shared a start line. Placings are " +
         "within each distance for this week only; wins, podiums, rivals and head to head leave these weeks out.</p></div>";
  }

  var w = race.weather;
  if (w) {
    h += '<div class="card"><h2>Conditions at the gun</h2>' +
      '<p class="hint">Measured at the venue at 6pm, when the series rolls off.</p>' +
      '<div class="stats">' +
      stat(fmtTemp(w.temp), "Temperature") +
      (w.feels != null ? stat(fmtTemp(w.feels), "Feels like") : "") +
      stat(wxLabel(w) || "—", "Sky", true) +
      (w.wind != null ? stat(Math.round(w.wind) + " mph", "Wind") : "") +
      (w.gust != null ? stat(Math.round(w.gust) + " mph", "Gusts") : "") +
      (w.humidity != null ? stat(Math.round(w.humidity) + "%", "Humidity") : "") +
      (w.precip_3h != null ? stat(w.precip_3h > 0 ? w.precip_3h.toFixed(2) + '"' : "None", "Rain, prior 3h") : "") +
      "</div></div>";
  }

  // One table per start-line group. These are separate races sharing a start
  // time, so a single ranked list would be wrong.
  var groups = (race.groups || []).slice();
  if (!groups.length) groups = [""];

  groups.forEach(function (n) {
    var g = rows.filter(function (r) { return distOf(r) === n; });
    if (!g.length) return;
    // A time is shown when there is one; otherwise what the source printed
    // ("DNF", "-1 lap") beats a bare dash.
    function timeCell(r) {
      return '<td class="num">' + (r.seconds == null && r.time && r.time !== "-" ? esc(r.time) : fmtTime(r.seconds)) + "</td>";
    }
    var cols = [
      { label: "Place", cls: "num", get: function (r) { return r.dplace; }, cell: function (r) { return placeCell(r); } },
      { label: "Racer", get: function (r) { return nameOf(r.racer); }, cell: function (r) { return "<td>" + racerLink(r.racer) + "</td>"; } }
    ];
    // Cross is one mass start where laps completed decide the order.
    if (race.discipline === "CX") {
      cols.push({ label: "Laps", cls: "num", get: function (r) { return r.laps; }, defaultDir: -1,
                  cell: function (r) { return '<td class="num">' + (r.laps == null ? "—" : r.laps) + "</td>"; } });
    }
    cols.push({ label: "Time", cls: "num", get: function (r) { return r.seconds; }, cell: timeCell });
    cols.push({ label: "Behind", cls: "num", get: function (r) { return r.gap; }, cell: function (r) { return '<td class="num muted">' + fmtGap(r.gap) + "</td>"; } });
    h += '<div class="card"><h2>' + esc(groups.length === 1 && n === "" ? "Results" : distLabel(n)) + "</h2>" +
      '<p class="hint">' + g.length + " finisher" + (g.length === 1 ? "" : "s") + "</p>" +
      table(cols, g, { sort: 0, dir: 1 }) + "</div>";
  });
  return h;
};

// Sport colours for the participation charts (course colours are for courses).
var EV_COLORS = { MTB: "#4f8fd9", TR: "#b07ad8", CX: "#4fb3a4", vMTB: "#8fb6e8", vTR: "#cdaee8" };

// How many people turn up. Older seasons are only the nights that survive on the old website, so the
// headline is the AVERAGE per night (a thin year is a smaller sample, not a smaller crowd) and every
// point says how many nights it rests on. Virtual weeks (self-timed) are counted apart from
// in-person nights, and only on their own filter.
function participationCard() {
  var races = RACES.filter(passRace).filter(function (r) { return discFilter === "V" ? r.virtual : !r.virtual; });
  var evs = {};
  races.forEach(function (r) {
    var ev = evOf(r);
    (evs[ev] = evs[ev] || []).push(r);
  });
  var order = Object.keys(evs).sort(function (a, b) { return evs[b].length - evs[a].length; });
  if (!order.length) return "";
  var trend = [], nights = [];
  order.forEach(function (ev) {
    var label = DISC_NAMES[ev] || ev, byYear = {};
    evs[ev].forEach(function (r) { (byYear[r.year] = byYear[r.year] || []).push(r); });
    var tp = Object.keys(byYear).map(function (y) {
      var rs = byYear[y], total = rs.reduce(function (n, r) { return n + (resultsByRace[r.raceid] || []).length; }, 0);
      var avg = total / rs.length;
      return { x: Date.parse(y + "-07-01"), y: avg,
               title: y + " · " + label + " · " + Math.round(avg) + " racers a night on average · " + rs.length + (rs.length === 1 ? " night" : " nights") + " on record" };
    });
    trend.push({ label: label, color: EV_COLORS[ev] || "#6f7a72", points: tp });
    nights.push({ label: label, color: EV_COLORS[ev] || "#6f7a72", points: evs[ev].map(function (r) {
      var n = (resultsByRace[r.raceid] || []).length;
      return { x: Date.parse(r.date), y: n, title: fmtDate(r.date) + " · " + label + " · " + n + " racers" + (r.course ? " · " + r.course : "") };
    }) });
  });
  function top(series) {
    var m = Math.max.apply(null, series.reduce(function (a, s) { return a.concat(s.points.map(function (p) { return p.y; })); }, [1]));
    return Math.ceil(m * 1.05 / 40) * 40;                    // a round top, so the gridlines read as 0 / 100 / 200...
  }
  var fmt = function (v) { return String(Math.round(v)); };
  return '<div class="card"><h2>How many people race</h2>' +
    '<p class="hint">Average racers per night, one point per season. Seasons before 2021 are only the nights that survive on ' +
    "Catamount's old website, so each point says how many nights it rests on: read a thin year as a small sample, not a small crowd. " +
    "Years with no results on record are left as gaps.</p>" +
    lineChart(trend, { xTicks: yearTicks(), trend: true, y0: 0, y1: top(trend), fmtY: fmt, gapMs: 400 * 864e5, label: "Average racers per night, by season" }) +
    legend(trend) +
    '<h2 style="margin-top:22px">Night by night</h2>' +
    '<p class="hint">Every race night, for the busy nights and the quiet ones. Pick a season to zoom in and join the dots.</p>' +
    lineChart(nights, { xTicks: yearTicks(), y0: 0, y1: top(nights), fmtY: fmt, label: "Racers on each race night" }) +
    "</div>";
}

function seasonsCard() {
  var rows = YEAR_LIST.map(function (y) {
    var rs = (years[y] || []).filter(passRace);
    var ids = {}; rs.forEach(function (r) { ids[r.raceid] = 1; });
    var res = RESULTS.filter(function (r) { return ids[r.raceid]; });
    var live = rs.filter(function (r) { return !r.virtual; });
    var liveStarts = live.reduce(function (n, r) { return n + (resultsByRace[r.raceid] || []).length; }, 0);
    return { year: y, races: rs.length, starts: res.length, perNight: live.length ? liveStarts / live.length : null,
             racers: new Set(res.map(function (r) { return r.racer; })).size,
             courses: new Set(rs.map(function (r) { return r.course; }).filter(Boolean)).size };
  }).filter(function (r) { return r.races; });
  return '<div class="card"><h2>Seasons</h2>' +
    table([
      { label: "Season", cls: "num", get: function (r) { return r.year; }, defaultDir: -1,
        cell: function (r) { return '<td class="num"><a href="#/series/' + r.year + '">' + r.year + "</a></td>"; } },
      { label: "Races", cls: "num", get: function (r) { return r.races; }, defaultDir: -1, cell: function (r) { return '<td class="num">' + r.races + "</td>"; } },
      { label: "Courses", cls: "num", get: function (r) { return r.courses; }, defaultDir: -1, cell: function (r) { return '<td class="num">' + r.courses + "</td>"; } },
      { label: "Racers", cls: "num", get: function (r) { return r.racers; }, defaultDir: -1, cell: function (r) { return '<td class="num">' + r.racers + "</td>"; } },
      { label: "Starts", cls: "num", get: function (r) { return r.starts; }, defaultDir: -1, cell: function (r) { return '<td class="num">' + r.starts + "</td>"; } },
      { label: "Per night", cls: "num", get: function (r) { return r.perNight; }, defaultDir: -1,
        cell: function (r) { return '<td class="num" title="Average racers on an in-person night">' + (r.perNight == null ? "—" : Math.round(r.perNight)) + "</td>"; } }
    ], rows, { sort: 0, dir: -1 }) + "</div>";
}

views.series = function (year) {
  if (!year) return filterBar() + participationCard() + seasonsCard();

  year = +year;
  var rs = (years[year] || []).filter(passRace);
  if (!rs.length) {
    return filterBar() + '<div class="card"><h2>No ' + (filterName() ? esc(filterName()) + " " : "") +
           "races in " + esc(year) + "</h2></div>" + seasonsCard();
  }

  var ids = {}; rs.forEach(function (r) { ids[r.raceid] = 1; });
  var res = RESULTS.filter(function (r) { return ids[r.raceid]; });
  var by = {};
  res.forEach(function (r) {
    var t = by[r.racer] || (by[r.racer] = { racer: r.racer, starts: 0, wins: 0, podiums: 0, pcts: [] });
    t.starts++;
    if (isWin(r)) t.wins++;
    if (isPodium(r)) t.podiums++;
    if (r.pct != null) t.pcts.push(r.pct);
  });
  var standings = Object.keys(by).map(function (k) {
    var t = by[k]; t.median = median(t.pcts); return t;
  });

  var h = filterBar() + '<div class="card"><p class="big-name">' + year + " season</p>" +
    '<div class="stats">' + stat(rs.length, "Races") +
    stat(new Set(rs.map(function (r) { return r.course; }).filter(Boolean)).size, "Courses") +
    stat(standings.length, "Racers") + stat(res.length, "Starts") + "</div></div>";

  h += '<div class="card"><h2>' + year + " standings</h2>" +
    '<p class="hint">Sorted by starts. Click any column to re-rank — median finish is the ' +
    "fairer measure if someone only showed up twice.</p>" +
    table([
      { label: "Racer", get: function (t) { return nameOf(t.racer); }, cell: function (t) { return "<td>" + racerLink(t.racer) + "</td>"; } },
      { label: "Starts", cls: "num", get: function (t) { return t.starts; }, defaultDir: -1, cell: function (t) { return '<td class="num">' + t.starts + "</td>"; } },
      { label: "Wins", cls: "num", get: function (t) { return t.wins; }, defaultDir: -1, cell: function (t) { return '<td class="num">' + (t.wins || "") + "</td>"; } },
      { label: "Podiums", cls: "num", get: function (t) { return t.podiums; }, defaultDir: -1, cell: function (t) { return '<td class="num">' + (t.podiums || "") + "</td>"; } },
      { label: "Median finish", cls: "num", get: function (t) { return t.median; }, defaultDir: -1,
        cell: function (t) { return '<td class="num">' + fmtPct(t.median) + "</td>"; } }
    ], standings, { sort: 1, dir: -1 }) + "</div>";

  h += '<div class="card"><h2>Race calendar</h2>' +
    table([
      { label: "Date", get: function (r) { return r.date; },
        cell: function (r) { return '<td><a href="#/race/' + r.raceid + '">' + fmtDate(r.date) + "</a></td>"; } },
      { label: "Course", get: function (r) { return r.course; }, cell: function (r) { return "<td>" + coursePill(r.course, r) + "</td>"; } },
      { label: "Finishers", cls: "num", get: function (r) { return (resultsByRace[r.raceid] || []).length; }, defaultDir: -1,
        cell: function (r) { return '<td class="num">' + (resultsByRace[r.raceid] || []).length + "</td>"; } },
      { label: "Weather", get: function (r) { return r.weather ? r.weather.temp : null; },
        cell: function (r) { return wxCell(r); } },
      { label: "Won by, longest distance", cell: function (r) {
          var n = (r.groups || [])[0];
          var w = n == null ? null : (resultsByDiv[r.raceid + "|" + n] || [])[0];
          return "<td>" + (w ? racerLink(w.racer) + ' <span class="muted">' + (n ? n + ", " : "") +
                 fmtTime(w.seconds) + "</span>" : "—") + "</td>"; } }
    ], rs.slice(), { sort: 0, dir: 1 }) + "</div>";

  return h;
};

views.races = function () {
